services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:17-alpine
    container_name: timeline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-my_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_DB: ${DB_NAME:-timeline_db}
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-my_user} -d ${DB_NAME:-timeline_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── NestJS Backend ───
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: timeline-server
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-my_user}
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      DB_NAME: ${DB_NAME:-timeline_db}
      PORT: 3000
    ports:
      - "${SERVER_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # ─── React/Vite Frontend (Nginx) ───
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: timeline-client
    restart: unless-stopped
    ports:
      - "${CLIENT_EXTERNAL_PORT:-80}:80"
    depends_on:
      - server

volumes:
  pg_data:
    driver: local
